[package]
name = "perry-ext-tursodb"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native bindings for Tursodb — a pure-Rust SQLite-compatible engine — for the Perry TypeScript-to-native compiler. Closes PerryTS/perry#424."
repository = "https://github.com/PerryTS/tursodb-bindings"
homepage = "https://github.com/PerryTS/tursodb-bindings"
readme = "README.md"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Tracks the perry-ffi v0.5 ABI surface published from the
# `PerryTS/perry` workspace. Pinned to a git rev rather than a
# crates.io release until perry-ffi is published on crates.io.
perry-ffi = { git = "https://github.com/PerryTS/perry", branch = "main" }
turso = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
serde_json = "1"
